<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
    <header>
        <div id="scoreboard">
            <span>Tu: <strong id="my-score">0</strong> pt</span>
            <span id="deck-info">Tallone: <strong id="deck-count">40</strong> carte</span>
            <span>Avversario: <strong id="opp-score">0</strong> pt</span>
        </div>
        <div id="status-bar">In attesa di un altro giocatore...</div>
    </header>

    <div id="opp-taken-pile" class="card pile hidden">
        <img src="/cards/napol/retro.jpg" alt="Prese Avversario" class="card-img">
    </div>

    <main id="table">
        <div id="side-deck">
            <div id="briscola-card" class="card briscola"></div>
            <div id="deck-pile" class="card back">
                <img src="/cards/napol/retro.jpg" alt="Mazzo" class="card-img">
            </div>
        </div>

        <div id="play-area">
            <div id="table-card-1" class="card empty">-</div>
            <div id="table-card-2" class="card empty">-</div>
        </div>
    </main>

    <div id="my-taken-pile" class="card pile hidden">
        <img src="/cards/napol/retro.jpg" alt="Le tue Prese" class="card-img">
    </div>

    <footer>
        <h3>La tua mano</h3>
        <div id="hand-container"></div>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
